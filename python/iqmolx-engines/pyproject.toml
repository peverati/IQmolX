[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iqmolx-engines"
version = "0.1.1"
description = "Python calculator helper for IQMolX (JSON lines over stdin/stdout)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy"]

[project.optional-dependencies]
ase = ["ase"]
test = ["pytest"]

[project.scripts]
iqmolx-engines = "iqmolx_engines.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
