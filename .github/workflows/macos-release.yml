# Builds IQMolX for Apple Silicon on GitHub's macOS 14 runner and, for a version tag, publishes
# the disk image as a release.  Because the libraries come from Homebrew on that runner, the
# app runs on macOS 14 (Sonoma) and later.
#
# Run by hand:  Actions > "macOS release" > Run workflow
# Release:      git tag v0.1.0 && git push origin v0.1.0
name: macOS release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the file name (default: the tag or the commit)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build and package (Apple Silicon, macOS 14)
    runs-on: macos-14
    timeout-minutes: 150
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Homebrew packages
        run: |
          brew update
          brew install qt@5 boost openssl@3 libomp gcc openblas
          # sanity: gfortran and Qt must be where the scripts expect them
          ls /opt/homebrew/bin/gfortran-* /opt/homebrew/opt/qt@5/bin/macdeployqt

      - name: CMake 3 (the OpenBabel submodule does not work with CMake 4)
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake3"
          "$RUNNER_TEMP/cmake3/bin/pip" install "cmake==3.31.*"
          echo "CMAKE3=$RUNNER_TEMP/cmake3/bin/cmake" >> "$GITHUB_ENV"

      - name: Cache xtb
        id: xtb-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../xtb-install
          key: xtb-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-xtb-macos.sh') }}

      - name: Build xtb (program and library)
        if: steps.xtb-cache.outputs.cache-hit != 'true'
        run: ./build-xtb-macos.sh

      - name: Build IQMolX
        run: XTB_ROOT="$GITHUB_WORKSPACE/../xtb-install" ./build-macos.sh

      - name: Tests
        continue-on-error: true      # reported, but does not stop the release (yet)
        run: |
          cd build-clean
          make -j4 OptimizerTest VibrationsTest XtbProcessTest XtbBackendTest XtbDialogTest XtbOrbitalsTest
          XTB="$GITHUB_WORKSPACE/../xtb-install/bin/xtb"
          bin/OptimizerTest
          bin/VibrationsTest
          bin/XtbProcessTest "$XTB"
          bin/XtbBackendTest "$XTB" ../tests/data
          bin/XtbOrbitalsTest "$XTB"
          QT_QPA_PLATFORM=offscreen bin/XtbDialogTest

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME}"
          XTB_ROOT="$GITHUB_WORKSPACE/../xtb-install" ./package-macos.sh build-clean "$VERSION"

      - name: Check what macOS versions the package needs
        run: |
          DMG=$(ls dist/*.dmg)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          APP="$MNT/IQMolX.app"
          WORST=0
          for f in $(find "$APP" -type f); do
            file -b "$f" | grep -q Mach-O || continue
            M=$(vtool -show-build "$f" 2>/dev/null | awk '/minos/{print $2; exit}')
            MAJOR=${M%%.*}
            [ -n "$MAJOR" ] && [ "$MAJOR" -gt "$WORST" ] && { WORST=$MAJOR; WHICH=$f; }
          done
          hdiutil detach "$MNT" -quiet
          echo "Highest minimum macOS in the package: $WORST ($WHICH)"
          [ "$WORST" -le 14 ] || { echo "Needs macOS $WORST, more than 14"; exit 1; }

      - name: Keep the disk image
        uses: actions/upload-artifact@v4
        with:
          name: IQMolX-macOS-arm64
          path: dist/*.dmg

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "IQMolX $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Apple Silicon Macs, macOS 14 or later.  Open the disk image and drag IQMolX to Applications.  The app is not notarized by Apple: on first start right-click it and choose Open, or run: xattr -dr com.apple.quarantine /Applications/IQMolX.app"
